name: Deploy To Windows Server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TEXTZY_FRONTEND_PATH: C:\HostingSpaces\admin\textzy.in\wwwroot
  TEXTZY_BACKEND_PATH: C:\HostingSpaces\admin\api.textzy.in\wwwroot
  TEXTZY_FRONTEND_SITE_NAME: textzy.in
  TEXTZY_BACKEND_SITE_NAME: api.textzy.in
  TEXTZY_FRONTEND_APP_POOL: textzy.in
  TEXTZY_BACKEND_APP_POOL: api.textzy.in
  TEXTZY_FRONTEND_API_BASE: https://api.textzy.in

jobs:
  build-backend:
    name: Build Backend Artifact
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend-dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Textzy.Api.csproj

      - name: Publish
        shell: powershell
        run: dotnet publish Textzy.Api.csproj -c Release -o "$env:GITHUB_WORKSPACE\\artifacts\\backend"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: textzy-backend
          path: ${{ github.workspace }}/artifacts/backend
          if-no-files-found: error
          retention-days: 14

  build-frontend:
    name: Build Frontend Artifact
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          REACT_APP_API_BASE: ${{ env.TEXTZY_FRONTEND_API_BASE }}
          REACT_APP_FACEBOOK_APP_ID: ${{ vars.REACT_APP_FACEBOOK_APP_ID || '' }}
          REACT_APP_WABA_EMBEDDED_CONFIG_ID: ${{ vars.REACT_APP_WABA_EMBEDDED_CONFIG_ID || '' }}
        run: npm run build

      - name: Verify frontend output
        shell: powershell
        run: |
          Write-Host "Frontend workspace:"
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\frontend"
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\frontend\dist")) {
            throw "frontend/dist was not created by npm run build"
          }
          Write-Host "Frontend dist contents:"
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\frontend\dist" -Recurse

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: textzy-frontend
          path: ${{ github.workspace }}/frontend/dist
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy To Windows IIS
    runs-on: [self-hosted, windows, textzy-deploy]
    needs:
      - build-backend
      - build-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: textzy-backend
          path: ${{ github.workspace }}/artifacts/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: textzy-frontend
          path: ${{ github.workspace }}/artifacts/frontend

      - name: Verify downloaded artifacts
        shell: powershell
        run: |
          Write-Host "Deploy workspace root:"
          Get-ChildItem -Path "${{ github.workspace }}"

          if (-not (Test-Path "${{ github.workspace }}\artifacts\backend")) {
            throw "Downloaded backend artifact folder is missing."
          }
          if (-not (Test-Path "${{ github.workspace }}\artifacts\frontend")) {
            throw "Downloaded frontend artifact folder is missing."
          }

          Write-Host "Backend artifact contents:"
          Get-ChildItem -Path "${{ github.workspace }}\artifacts\backend" -Recurse

          Write-Host "Frontend artifact contents:"
          Get-ChildItem -Path "${{ github.workspace }}\artifacts\frontend" -Recurse

      - name: Deploy artifacts to IIS
        shell: powershell
        env:
          TEXTZY_FRONTEND_FACEBOOK_APP_ID: ${{ vars.REACT_APP_FACEBOOK_APP_ID || '' }}
          TEXTZY_FRONTEND_WABA_EMBEDDED_CONFIG_ID: ${{ vars.REACT_APP_WABA_EMBEDDED_CONFIG_ID || '' }}
        run: >
          .\scripts\deploy-windows-artifact.ps1
          -FrontendArtifactPath "${{ github.workspace }}\artifacts\frontend"
          -BackendArtifactPath "${{ github.workspace }}\artifacts\backend"
          -FrontendTargetPath "$env:TEXTZY_FRONTEND_PATH"
          -BackendTargetPath "$env:TEXTZY_BACKEND_PATH"
          -FrontendSiteName "$env:TEXTZY_FRONTEND_SITE_NAME"
          -BackendSiteName "$env:TEXTZY_BACKEND_SITE_NAME"
          -FrontendAppPool "$env:TEXTZY_FRONTEND_APP_POOL"
          -BackendAppPool "$env:TEXTZY_BACKEND_APP_POOL"
          -FrontendApiBase "$env:TEXTZY_FRONTEND_API_BASE"
          -FrontendFacebookAppId "$env:TEXTZY_FRONTEND_FACEBOOK_APP_ID"
          -FrontendWabaEmbeddedConfigId "$env:TEXTZY_FRONTEND_WABA_EMBEDDED_CONFIG_ID"
          -ReleaseTag "${{ github.run_number }}-${{ github.sha }}"
